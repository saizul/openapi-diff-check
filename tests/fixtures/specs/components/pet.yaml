Pet:
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
    name:
      type: string
    status:
      $ref: "#/Status"
NewPet:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 100
    tag:
      type: string
Status:
  type: string
  enum: [available, pending, sold]
