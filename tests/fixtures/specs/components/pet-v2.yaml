Pet:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string
    status:
      $ref: "#/Status"
NewPet:
  type: object
  required: [name, owner]
  properties:
    name:
      type: string
      maxLength: 50
    tag:
      type: string
    owner:
      type: string
Status:
  type: string
  enum: [available, pending, sold, adopted]
