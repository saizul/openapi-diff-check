description: A property that clients used to send becomes readOnly.
old:
  openapi: 3.0.3
  info:
    title: Users
    version: 1.0.0
  paths:
    /users:
      post:
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        responses:
          '201':
            description: Created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/User'
  components:
    schemas:
      User:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
new:
  openapi: 3.0.3
  info:
    title: Users
    version: 1.0.0
  paths:
    /users:
      post:
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        responses:
          '201':
            description: Created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/User'
  components:
    schemas:
      User:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
            readOnly: true
expect:
- rule: request-property-became-read-only
  severity: breaking
location: request body application/json email
