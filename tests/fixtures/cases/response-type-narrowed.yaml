description: number -> integer is safe for readers.
old:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      get:
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    price:
                      type: number
new:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      get:
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    price:
                      type: integer
expect:
- rule: response-type-narrowed
  severity: non-breaking
