description: Returning fewer values is safe.
old:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      get:
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - available
                      - sold
new:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      get:
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - available
expect:
- rule: response-enum-value-removed
  severity: non-breaking
