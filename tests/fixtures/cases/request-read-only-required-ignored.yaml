description: readOnly properties are not sent by clients.
old:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        responses:
          '201':
            description: Created
new:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  id:
                    type: integer
                    readOnly: true
                required:
                - name
                - id
        responses:
          '201':
            description: Created
expect: []
