description: Restricting a free string to an enum.
old:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
        responses:
          '201':
            description: Created
new:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - cat
                    - dog
        responses:
          '201':
            description: Created
expect:
- rule: request-enum-added
  severity: breaking
