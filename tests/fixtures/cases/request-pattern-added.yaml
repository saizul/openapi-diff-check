description: A pattern restricts accepted values.
old:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
        responses:
          '201':
            description: Created
new:
  openapi: 3.0.3
  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: ^[A-Z]{3}$
        responses:
          '201':
            description: Created
expect:
- rule: request-constraint-narrowed
  severity: breaking
