  info:
    title: Pets
    version: 1.0.0
  paths:
    /pets:
      parameters:
      - name: tenant
        in: query
        required: false
        schema:
          type: string
      get:
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: string
